<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>backchannel</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --border: #262c38;
    --text: #d7dce4;
    --muted: #7d8590;
    --accent: #4f8cff;
    --pending: #e3b341;
    --needs: #f85149;
    --answered: #3fb950;
    --error: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .live { font-size: 11px; color: var(--muted); }
  header .live.on { color: var(--answered); }
  main { flex: 1; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
  #list { border-right: 1px solid var(--border); overflow-y: auto; }
  .thread {
    padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .thread:hover { background: #1a1f29; }
  .thread.sel { background: #1d2634; border-left: 2px solid var(--accent); }
  .thread .subj { font-size: 13px; margin-bottom: 4px; word-break: break-word; }
  .thread .meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .badge {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    padding: 1px 6px; border-radius: 8px; color: #0d1117;
  }
  .badge.pending { background: var(--pending); }
  .badge.needs_human { background: var(--needs); color: #fff; }
  .badge.answered { background: var(--answered); }
  .badge.error { background: var(--error); color: #fff; }
  #detail { display: flex; flex-direction: column; min-height: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 14px; max-width: 72ch; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .msg .body {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.human .body { border-color: var(--answered); }
  .msg.local .body { border-color: var(--accent); }
  #empty { color: var(--muted); padding: 40px; text-align: center; }
  #replybar { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 10px; }
  #reply {
    flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 8px 10px; font: inherit; resize: vertical; min-height: 40px;
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>backchannel</h1>
  <span class="live" id="live">connecting…</span>
</header>
<main>
  <div id="list"></div>
  <div id="detail">
    <div id="msgs"><div id="empty">Select a thread</div></div>
    <div id="replybar" style="display:none">
      <textarea id="reply" placeholder="Reply as Tayden…"></textarea>
      <button id="send">Send as Tayden</button>
      <button id="retry" class="secondary">Retry</button>
    </div>
  </div>
</main>
<script>
const listEl = document.getElementById("list");
const msgsEl = document.getElementById("msgs");
const replybar = document.getElementById("replybar");
const replyEl = document.getElementById("reply");
const liveEl = document.getElementById("live");
let threads = [];
let selected = null;

const STATUS_ORDER = { needs_human: 0, error: 1, pending: 2, answered: 3 };
function sortThreads(ts) {
  return [...ts].sort((a, b) =>
    (STATUS_ORDER[a.status] - STATUS_ORDER[b.status]) || (b.updated_at - a.updated_at));
}
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmt(ts) { return new Date(ts).toLocaleTimeString(); }

function renderList() {
  listEl.innerHTML = sortThreads(threads).map(t => `
    <div class="thread ${t.id === selected ? "sel" : ""}" data-id="${t.id}">
      <div class="subj">${esc(t.subject)}</div>
      <div class="meta">
        <span class="badge ${t.status}">${t.status.replace("_", " ")}</span>
        <span>${esc(t.caller)}</span><span>${fmt(t.updated_at)}</span>
      </div>
    </div>`).join("") || `<div id="empty">No threads yet</div>`;
  listEl.querySelectorAll(".thread").forEach(el =>
    el.addEventListener("click", () => select(el.dataset.id)));
}

function renderDetail() {
  const t = threads.find(x => x.id === selected);
  if (!t) {
    msgsEl.innerHTML = `<div id="empty">Select a thread</div>`;
    replybar.style.display = "none";
    return;
  }
  replybar.style.display = "flex";
  msgsEl.innerHTML = (t.messages || []).map(m => `
    <div class="msg ${esc(m.sender)}">
      <div class="who">${esc(m.sender)} · ${fmt(m.created_at)}</div>
      <div class="body">${esc(m.body)}</div>
    </div>`).join("");
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function select(id) { selected = id; renderList(); renderDetail(); }

async function load() {
  const res = await fetch("/api/threads");
  threads = (await res.json()).threads;
  renderList(); renderDetail();
}

document.getElementById("send").addEventListener("click", async () => {
  const body = replyEl.value.trim();
  if (!body || !selected) return;
  await fetch(`/api/threads/${selected}/reply`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ body })
  });
  replyEl.value = "";
});

document.getElementById("retry").addEventListener("click", async () => {
  if (!selected) return;
  await fetch(`/api/threads/${selected}/retry`, { method: "POST" });
});

const es = new EventSource("/api/events");
es.onopen = () => { liveEl.textContent = "live"; liveEl.classList.add("on"); };
es.onerror = () => { liveEl.textContent = "disconnected"; liveEl.classList.remove("on"); };
es.onmessage = (ev) => {
  const data = JSON.parse(ev.data);
  if (data.type === "thread") {
    const i = threads.findIndex(t => t.id === data.thread.id);
    if (i >= 0) threads[i] = data.thread; else threads.unshift(data.thread);
    renderList(); renderDetail();
  }
};

load();
</script>
</body>
</html>
